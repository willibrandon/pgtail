name: Release

on:
  push:
    tags:
      - 'v*'

# Creating the release, trusted publishing to nuget.org, and opening an issue when a release fails.
permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  # Publish each runtime with Native AOT, check the executable, and pack its runtime-specific tool package.
  native:
    name: native build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
            archive: pgtail-macos-arm64
          - rid: osx-x64
            os: macos-15-intel
            archive: pgtail-macos-x86_64
          - rid: linux-x64
            os: ubuntu-latest
            archive: pgtail-linux-x86_64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: pgtail-linux-arm64
          - rid: win-x64
            os: windows-2025-vs2026
            archive: pgtail-windows-x86_64
          - rid: win-arm64
            os: windows-11-arm
            archive: pgtail-windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish, check, and pack
        run: dotnet run --file scripts/Publish-NativeAot.cs -- --rid ${{ matrix.rid }} --package-version ${{ github.ref_name }}

      - name: Create and verify tar.gz archive
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.archive }}"
          # The executable and Hex1b's native console helper, which must stay beside it
          cp -R artifacts/native-aot/${{ matrix.rid }}/publish/. LICENSE "dist/${{ matrix.archive }}/"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          mkdir -p archive-check
          tar -C archive-check -xzf "dist/${{ matrix.archive }}.tar.gz"
          "archive-check/${{ matrix.archive }}/pgtail" --version

      - name: Create and verify ZIP archive
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist\${{ matrix.archive }}" | Out-Null
          Copy-Item -Recurse "artifacts\native-aot\${{ matrix.rid }}\publish\*" "dist\${{ matrix.archive }}\"
          Copy-Item "LICENSE" "dist\${{ matrix.archive }}\"
          Compress-Archive -Path "dist\${{ matrix.archive }}" -DestinationPath "dist\${{ matrix.archive }}.zip"
          Expand-Archive -Path "dist\${{ matrix.archive }}.zip" -DestinationPath "archive-check"
          if (-not (Test-Path "archive-check\${{ matrix.archive }}\pgtail.exe")) {
            Write-Error "pgtail.exe not found in the extracted ZIP"
            exit 1
          }
          & "archive-check\${{ matrix.archive }}\pgtail.exe" --version

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.*
          if-no-files-found: error
          retention-days: 1

      - name: Upload tool package
        uses: actions/upload-artifact@v7
        with:
          name: tool-package-${{ matrix.rid }}
          path: artifacts/native-aot/${{ matrix.rid }}/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

      # The MSI installs the x64 build, as it always has.
      - name: Extract version from tag
        if: matrix.rid == 'win-x64'
        id: version
        shell: pwsh
        run: |
          # Full version for display (e.g., 0.2.0-rc1)
          $fullVersion = "${{ github.ref_name }}" -replace '^v', ''
          echo "full_version=$fullVersion" >> $env:GITHUB_OUTPUT

          # MSI version must be numeric only (X.Y.Z), strip prerelease suffix
          $msiVersion = $fullVersion -replace '-.*$', ''
          echo "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Full version: $fullVersion, MSI version: $msiVersion"

      - name: Install WiX Toolset
        if: matrix.rid == 'win-x64'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI with WiX
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # SourceDir is relative to the .wxs file (wix\), so it starts with ..\dist\
          wix build wix\pgtail.wxs `
            -d SourceDir=..\dist\${{ matrix.archive }} `
            -d Version=${{ steps.version.outputs.msi_version }} `
            -arch x64 `
            -out dist\${{ matrix.archive }}.msi

      - name: Verify MSI installs correctly
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # Silent install to the default location (Program Files\pgtail), with a verbose log for diagnosis
          $logFile = "dist\msi-install.log"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "dist\${{ matrix.archive }}.msi", "/qn", "/l*v", $logFile -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "MSI installation failed with exit code: $($proc.ExitCode)"
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-Object -Last 50
            }
            exit 1
          }

          $exePath = "${env:ProgramFiles}\pgtail\pgtail.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "pgtail.exe not found at $exePath"
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-Object -Last 50
            }
            exit 1
          }
          & $exePath --version

          # winget validation starts pgtail with no arguments in several ways; each must exit cleanly
          Write-Host "Test 1: Start-Process -NoNewWindow"
          $proc = Start-Process -FilePath $exePath -NoNewWindow -Wait -PassThru
          Write-Host "Exit code: $($proc.ExitCode)"

          Write-Host "Test 2: Start-Process in a new console (10s timeout)"
          $proc2 = Start-Process -FilePath $exePath -PassThru
          if (-not $proc2.WaitForExit(10000)) {
            Write-Host "ERROR: timed out after 10s"
            $proc2.Kill()
            $proc2.WaitForExit()
            $proc2ExitCode = -1
          } else {
            $proc2ExitCode = $proc2.ExitCode
          }
          Write-Host "Exit code: $proc2ExitCode"

          Write-Host "Test 3: cmd.exe /c"
          cmd.exe /c $exePath
          Write-Host "Exit code: $LASTEXITCODE"

          if ($proc.ExitCode -ne 0 -or $proc2ExitCode -ne 0 -or $LASTEXITCODE -ne 0) {
            Write-Error "One or more ways of starting pgtail returned a non-zero exit code, which fails winget validation"
            exit 1
          }

          Start-Process msiexec.exe -ArgumentList "/x", "dist\${{ matrix.archive }}.msi", "/qn" -Wait -NoNewWindow

      - name: Upload MSI
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: msi-${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.msi
          if-no-files-found: error
          retention-days: 1

  # Pack the pointer package, which picks the runtime package for the machine, and the portable fallback.
  tool-packages:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download runtime packages
        uses: actions/download-artifact@v8
        with:
          pattern: tool-package-*
          path: nupkg
          merge-multiple: true

      - name: Pack the pointer and portable packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/Pgtail/Pgtail.csproj -c Release -p:Version="$version" -p:PackageVersion="$version" -o nupkg
          dotnet pack src/Pgtail/Pgtail.csproj -c Release -r any -p:PublishAot=false -p:Version="$version" -p:PackageVersion="$version" -o nupkg

      - name: Verify installation through the pointer package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet tool install pgtail --tool-path tool-check --version "$version" --add-source "$PWD/nupkg" --no-cache --ignore-failed-sources
          tool-check/pgtail --version | grep -qx "pgtail $version"

      - name: Upload tool packages
        uses: actions/upload-artifact@v7
        with:
          name: tool-packages
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 1

  # Create the GitHub release with every archive, the MSI, and their checksums.
  release:
    needs: [native, tool-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256_macos_arm64: ${{ steps.checksums.outputs.sha256_macos_arm64 }}
      sha256_macos_x86_64: ${{ steps.checksums.outputs.sha256_macos_x86_64 }}
      sha256_linux_x86_64: ${{ steps.checksums.outputs.sha256_linux_x86_64 }}
      sha256_linux_arm64: ${{ steps.checksums.outputs.sha256_linux_arm64 }}
      sha256_windows_x86_64: ${{ steps.checksums.outputs.sha256_windows_x86_64 }}
      sha256_windows_arm64: ${{ steps.checksums.outputs.sha256_windows_arm64 }}
      sha256_windows_msi: ${{ steps.checksums.outputs.sha256_windows_msi }}

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: release
          merge-multiple: true

      - name: Download the MSI
        uses: actions/download-artifact@v8
        with:
          pattern: msi-*
          path: release
          merge-multiple: true

      - name: Check archive sizes
        run: |
          echo "Checking archive sizes (max 50MB = 52428800 bytes)..."
          for archive in release/pgtail-*; do
            size=$(stat -c%s "$archive")
            echo "$archive: $size bytes"
            if [ "$size" -gt 52428800 ]; then
              echo "::error::Archive $archive exceeds 50MB limit: $size bytes"
              exit 1
            fi
          done

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          cd release
          for file in pgtail-*.tar.gz pgtail-*.zip pgtail-*.msi; do
            sha256sum "$file" > "$file.sha256"
          done

          echo "sha256_macos_arm64=$(cut -d' ' -f1 pgtail-macos-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_macos_x86_64=$(cut -d' ' -f1 pgtail-macos-x86_64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_linux_x86_64=$(cut -d' ' -f1 pgtail-linux-x86_64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_linux_arm64=$(cut -d' ' -f1 pgtail-linux-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_windows_x86_64=$(cut -d' ' -f1 pgtail-windows-x86_64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_windows_arm64=$(cut -d' ' -f1 pgtail-windows-arm64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_windows_msi=$(cut -d' ' -f1 pgtail-windows-x86_64.msi.sha256)" >> $GITHUB_OUTPUT

          echo "SHA256 Checksums:"
          cat *.sha256

      - name: Verify the Linux archive
        run: |
          mkdir -p archive-check
          tar -C archive-check -xzf release/pgtail-linux-x86_64.tar.gz
          archive-check/pgtail-linux-x86_64/pgtail --version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push the runtime packages first, then the pointer package that refers to them.
  publish-nuget:
    needs: [tool-packages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download tool packages
        uses: actions/download-artifact@v8
        with:
          name: tool-packages
          path: nupkg

      # Trusted publishing: nuget.org issues a short-lived key from the workflow's identity.
      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push runtime packages, then the pointer
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for rid in any win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            package="nupkg/pgtail.$rid.$version.nupkg"
            test -f "$package"
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push "nupkg/pgtail.$version.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Update Scoop bucket manifest with new version and checksums
  update-scoop:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Updating Scoop manifest to version $VERSION"

      - name: Clone scoop-bucket repository
        run: |
          git clone https://x-access-token:${{ secrets.SCOOP_BUCKET_TOKEN }}@github.com/willibrandon/scoop-bucket.git
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update pgtail manifest
        run: |
          cd scoop-bucket
          mkdir -p bucket

          python3 << 'EOF'
          import json

          version = "${{ steps.version.outputs.version }}"
          sha_windows_x86_64 = "${{ needs.release.outputs.sha256_windows_x86_64 }}"
          sha_windows_arm64 = "${{ needs.release.outputs.sha256_windows_arm64 }}"
          base = f"https://github.com/willibrandon/pgtail/releases/download/v{version}"

          manifest = {
              "version": version,
              "description": "PostgreSQL log tailer with auto-detection and color output",
              "homepage": "https://github.com/willibrandon/pgtail",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": f"{base}/pgtail-windows-x86_64.zip",
                      "hash": sha_windows_x86_64,
                      "extract_dir": "pgtail-windows-x86_64",
                  },
                  "arm64": {
                      "url": f"{base}/pgtail-windows-arm64.zip",
                      "hash": sha_windows_arm64,
                      "extract_dir": "pgtail-windows-arm64",
                  },
              },
              "bin": "pgtail.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/willibrandon/pgtail/releases/download/v$version/pgtail-windows-x86_64.zip"
                      },
                      "arm64": {
                          "url": "https://github.com/willibrandon/pgtail/releases/download/v$version/pgtail-windows-arm64.zip"
                      },
                  },
                  "hash": {
                      "url": "$url.sha256"
                  },
              },
          }

          with open("bucket/pgtail.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=4)
              f.write("\n")
          EOF

          python3 -m json.tool bucket/pgtail.json >/dev/null

          echo "Updated bucket/pgtail.json:"
          cat bucket/pgtail.json

      - name: Ensure README lists pgtail
        run: |
          cd scoop-bucket

          python3 << 'EOF'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          if "scoop install pgtail" not in text:
              text = text.replace(
                  "scoop install scout\n",
                  "scoop install scout\nscoop install pgtail\n",
              )

          if "scoop update pgtail" not in text:
              text = text.replace(
                  "scoop update scout\n",
                  "scoop update scout\nscoop update pgtail\n",
              )

          row = "| [pgtail](https://github.com/willibrandon/pgtail) | PostgreSQL log tailer with auto-detection and color output |"
          if row not in text:
              scout_row = "| [scout](https://github.com/willibrandon/scout) | Feature-complete port of ripgrep to .NET Native AOT |"
              text = text.replace(f"{scout_row}\n", f"{scout_row}\n{row}\n")

          path.write_text(text, encoding="utf-8")
          EOF

          echo "Updated README.md:"
          cat README.md

      - name: Commit and push changes
        run: |
          cd scoop-bucket
          VERSION="${{ steps.version.outputs.version }}"

          git add bucket/pgtail.json README.md
          git diff --staged --quiet || git commit -m "Update pgtail to $VERSION"
          git push origin main

  # Update Homebrew formula with new version and checksums
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Updating Homebrew formula to version $VERSION"

      - name: Clone homebrew-tap repository
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/willibrandon/homebrew-tap.git
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update formula with new version and checksums
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"

          # Update version
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/pgtail.rb

          # Update SHA256 checksums using Python for reliable replacement
          python3 << 'EOF'
          import re

          with open('Formula/pgtail.rb', 'r') as f:
              content = f.read()

          shas = {
              'macos-arm64': '${{ needs.release.outputs.sha256_macos_arm64 }}',
              'macos-x86_64': '${{ needs.release.outputs.sha256_macos_x86_64 }}',
              'linux-arm64': '${{ needs.release.outputs.sha256_linux_arm64 }}',
              'linux-x86_64': '${{ needs.release.outputs.sha256_linux_x86_64 }}',
          }

          # Each platform's url line is followed by its sha256 line
          for platform, sha in shas.items():
              pattern = rf'(url "https://github\.com/willibrandon/pgtail/releases/download/v#\{{version\}}/pgtail-{platform}\.tar\.gz"\s+sha256 ")[^"]*(")'
              content = re.sub(pattern, rf'\g<1>{sha}\2', content)

          with open('Formula/pgtail.rb', 'w') as f:
              f.write(content)
          EOF

          echo "Updated Formula/pgtail.rb:"
          cat Formula/pgtail.rb

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"

          git add Formula/pgtail.rb
          git diff --staged --quiet || git commit -m "Update pgtail to $VERSION"
          git push origin main

  # Update winget manifest and submit PR
  update-winget:
    needs: release
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Updating winget manifest to version $version"

      - name: Check if package exists in winget-pkgs
        id: check
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/pgtail" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            echo "Package not yet in winget-pkgs, skipping update"
          }

      - name: Install wingetcreate
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Generate winget manifest
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/willibrandon/pgtail/releases/download/v$version/pgtail-windows-x86_64.msi"

          # Use --token to auto-fill ReleaseDate and ReleaseNotesUrl from GitHub release
          .\wingetcreate.exe update willibrandon.pgtail `
            --version $version `
            --urls $url `
            --token $env:GH_TOKEN `
            --out manifests

      - name: Submit winget PR via GitHub API
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "pgtail-$version"
          $manifestDir = "manifests/w/willibrandon/pgtail/$version"

          # Sync fork with upstream first
          Write-Host "Syncing fork with upstream..."
          gh api repos/willibrandon/winget-pkgs/merge-upstream -X POST -f branch="master"

          # Get fork's master commit SHA (now synced with upstream)
          $forkRef = gh api repos/willibrandon/winget-pkgs/git/ref/heads/master --jq '.object.sha'
          Write-Host "Fork master SHA: $forkRef"

          # Get the tree SHA for that commit
          $baseTreeSha = gh api "repos/willibrandon/winget-pkgs/git/commits/$forkRef" --jq '.tree.sha'
          Write-Host "Base tree SHA: $baseTreeSha"

          # Create blobs for each manifest file and build tree entries
          $treeEntries = [System.Collections.ArrayList]@()
          Get-ChildItem -Path "manifests" -Recurse -File | ForEach-Object {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($_.FullName))
            $blobResponse = gh api repos/willibrandon/winget-pkgs/git/blobs -X POST -f content="$content" -f encoding="base64"
            $blobSha = $blobResponse | ConvertFrom-Json | Select-Object -ExpandProperty sha
            $path = "$manifestDir/$($_.Name)"
            Write-Host "Created blob for $path : $blobSha"
            [void]$treeEntries.Add(@{path=$path; mode="100644"; type="blob"; sha=$blobSha})
          }

          # Create new tree with manifest files added
          $treeData = @{base_tree=$baseTreeSha; tree=$treeEntries.ToArray()}
          $treeJson = $treeData | ConvertTo-Json -Depth 10
          Write-Host "Tree JSON: $treeJson"
          $treeJson | Out-File -FilePath tree.json -Encoding utf8NoBOM
          $newTree = gh api repos/willibrandon/winget-pkgs/git/trees -X POST --input tree.json
          $newTreeSha = $newTree | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New tree SHA: $newTreeSha"

          # Create commit
          $commitJson = @{
            message="Update willibrandon.pgtail to $version"
            tree=$newTreeSha
            parents=@($forkRef)
          } | ConvertTo-Json -Compress
          $commitJson | Out-File -FilePath commit.json -Encoding utf8
          $newCommit = gh api repos/willibrandon/winget-pkgs/git/commits -X POST --input commit.json
          $newCommitSha = $newCommit | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New commit SHA: $newCommitSha"

          # Create or update branch reference
          $refExists = gh api "repos/willibrandon/winget-pkgs/git/ref/heads/$branch" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh api "repos/willibrandon/winget-pkgs/git/refs/heads/$branch" -X PATCH -f sha="$newCommitSha" -F force=true
          } else {
            gh api repos/willibrandon/winget-pkgs/git/refs -X POST -f ref="refs/heads/$branch" -f sha="$newCommitSha"
          }
          Write-Host "Branch $branch updated to $newCommitSha"

          # Create PR
          gh pr create `
            --repo microsoft/winget-pkgs `
            --base master `
            --head willibrandon:$branch `
            --title "Update willibrandon.pgtail to $version" `
            --body "## Description`n`nUpdate pgtail to version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/pgtail/releases/tag/v$version"

  # Notify on failure
  notify-failure:
    needs: [native, tool-packages, release, publish-nuget, update-scoop, update-homebrew, update-winget]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const tag = context.ref.replace('refs/tags/', '');

            await github.rest.issues.create({
              owner,
              repo,
              title: `Release ${tag} failed`,
              body: `The release workflow for ${tag} failed.\n\nSee the [workflow run](${runUrl}) for details.`,
              labels: ['bug', 'release']
            });
