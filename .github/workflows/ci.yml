name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # v0 moves with Picket's releases. Findings that are not secrets are listed in .picketignore by fingerprint.
      - name: Scan for secrets
        uses: willibrandon/picket@v0
        with:
          ignore-path: .picketignore
          cache-mode: secret-hash-only
          fail-on: findings
          redact: 100
          timeout: 300

  docs-colors:
    name: docs colors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The site's pgtail blocks are colored by pgtail's own formatter; this fails when they are out of date.
      - name: Check the documentation's colors
        run: dotnet run --file scripts/Highlight-Docs.cs -- --verify

  test:
    name: tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: macOS Arm64
            os: macos-14
            artifact: macos-arm64
          - name: Windows x64
            os: windows-2025-vs2026
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        env:
          # Terminal recordings of the tests that run pgtail, uploaded with the results for playback.
          PGTAIL_TEST_RECORDINGS: ${{ github.workspace }}/TestResults/recordings
        run: >-
          dotnet test -c Release --no-build --report-trx --results-directory TestResults
          --hangdump --hangdump-timeout 10m --hangdump-type None

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: TestResults/

  native-aot:
    name: native build (${{ matrix.rid }})
    # The size check reads the baseline that the branch's last good run stored.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2025-vs2026
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish, check, and pack
        run: dotnet run --file scripts/Publish-NativeAot.cs -- --rid ${{ matrix.rid }}

      # v0 moves with Dotsider's releases. The cap is absolute; growth is measured against the branch's last good build.
      - name: Check Native AOT size
        uses: willibrandon/dotsider@v0
        with:
          # The size report the Native AOT compiler writes beside its object files.
          target: src/Pgtail/obj/Release/net10.0/${{ matrix.rid }}/native/pgtail.mstat
          baseline-key: pgtail-${{ matrix.rid }}
          budgets: |
            max=25mb
            growth=5%
          top: '20'
          report-directory: ${{ runner.temp }}/dotsider-size-check-${{ matrix.rid }}
          artifact-name: dotsider-size-check-${{ matrix.rid }}
